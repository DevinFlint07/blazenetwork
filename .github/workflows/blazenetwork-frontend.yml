name: BlazeNetwork Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - blazenetwork
    paths:
      - 'apps/frontend/**/*'
      - 'packages/ui/**/*'
      - 'packages/utils/**/*'
      - 'packages/assets/**/*'
      - 'packages/moderation/**/*'
      - 'packages/api-client/**/*'
      - 'packages/blog/**/*'
      - '**/pnpm-*.yaml'
      - .github/workflows/blazenetwork-frontend.yml

env:
  TURBO_TELEMETRY_DISABLED: 1
  pnpm_config_color: always
  NODE_ENV: production

jobs:
  build-and-push:
    name: Build and push frontend Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy BlazeNetwork environment
        run: |
          cp apps/frontend/.env.blazenetwork apps/frontend/.env

      - name: Build i18n coverage (generates missing file)
        run: pnpm run i18n:coverage

      - name: Build frontend
        run: pnpm run build
        working-directory: apps/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/frontend:blazenetwork
            ghcr.io/${{ env.REPO_LC }}/frontend:blazenetwork-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_URL=https://blazenetwork.fun/api/
            BROWSER_BASE_URL=https://blazenetwork.fun/api/
