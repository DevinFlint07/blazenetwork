user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for"';

	access_log /var/log/nginx/access.log main;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types text/plain text/css text/xml text/javascript
			   application/json application/javascript application/xml+rss
			   application/rss+xml font/truetype font/opentype
			   application/vnd.ms-fontobject image/svg+xml;

	# Rate limiting
	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

	# Upstream servers
	upstream frontend {
		server frontend:3000;
		keepalive 32;
	}

	upstream labrinth {
		server labrinth:8000;
	}

	# HTTP server - redirect to HTTPS
	server {
		listen 80;
		server_name blazenetwork.fun www.blazenetwork.fun;

		location / {
			return 301 https://$host$request_uri;
		}
	}

	# HTTPS server
	server {
		listen 443 ssl;
		http2 on;
		server_name blazenetwork.fun www.blazenetwork.fun;

		# SSL configuration
		ssl_certificate /etc/nginx/ssl/fullchain.pem;
		ssl_certificate_key /etc/nginx/ssl/privkey.pem;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;
		ssl_prefer_server_ciphers on;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# API routes - backend
		location /api/ {
			limit_req zone=api_limit burst=20 nodelay;
			rewrite ^/api/(.*) /$1 break;
			proxy_pass http://labrinth;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_cache_bypass $http_upgrade;
		}

		# Proxy v3 API to staging for frontend compatibility
		location /v3/ {
			proxy_pass https://staging-api.modrinth.com/v3/;
			proxy_http_version 1.1;
			proxy_set_header Host staging-api.modrinth.com;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_ssl_server_name on;
			proxy_ssl_protocols TLSv1.2 TLSv1.3;
		}

		# Proxy _internal API to staging for frontend compatibility
		location /_internal/ {
			proxy_pass https://staging-api.modrinth.com/_internal/;
			proxy_http_version 1.1;
			proxy_set_header Host staging-api.modrinth.com;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto https;
			proxy_ssl_server_name on;
			proxy_ssl_protocols TLSv1.2 TLSv1.3;
		}



		# CDN routes - backend
		location /cdn/ {
			proxy_pass http://labrinth;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Archon routes
		location /archon/ {
			proxy_pass http://labrinth;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# All other routes - API documentation
		location / {
			return 200 '<!DOCTYPE html><html><head><title>BlazeNetwork API</title><style>body{font-family:system-ui;max-width:800px;margin:50px auto;padding:20px;line-height:1.6}h1{color:#333}a{color:#0066cc}.status{padding:10px;background:#e8f5e9;border-radius:4px;margin:20px 0}</style></head><body><h1>BlazeNetwork Modrinth API</h1><div class="status">✅ Backend API is running</div><p><strong>API Endpoint:</strong> <a href="/api/">/api/</a></p><p><strong>Documentation:</strong> The BlazeNetwork deployment uses the Modrinth Labrinth backend API.</p><p>Current status:</p><ul><li>✅ Backend API: <a href="/api/">/api/</a></li><li>✅ Database: PostgreSQL</li><li>✅ Search: Elasticsearch + Meilisearch</li><li>✅ Cache: Redis</li></ul><p>To interact with the API, use the <code>/api/</code> endpoint.</p></body></html>';
			add_header Content-Type text/html;
		}

		# Assets - serve from frontend with proper caching
		location /_assets/ {
			proxy_pass http://frontend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_cache_valid 200 7d;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}

		# Static assets
		location ~* \.(svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
			proxy_pass http://frontend;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_cache_valid 200 30d;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}
	}
}
